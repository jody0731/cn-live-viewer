name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package (not editable, so the mpv scripts must ship in it)
        run: python -m pip install .
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -t . -v
      - name: Command line starts
        run: |
          cn-live-viewer --version
          cn-live-viewer --help

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Syntax check the mpv scripts
        run: for f in src/cn_live_viewer/mpv/*.lua; do luajit -bl "$f" > /dev/null || exit 1; done

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
