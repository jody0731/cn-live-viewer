name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package (not editable, so the mpv scripts must ship in it)
        run: python -m pip install .
      - name: Unit tests (offline; the mpv smoke test skips here, mpv isn't installed)
        run: python -m unittest discover -s tests -t . -v
      - name: Command line starts
        run: |
          cn-live-viewer --version
          cn-live-viewer --help

  mpv:
    # the real mpv with our scripts, over the real IPC: a Unix socket on Linux and macOS, a named pipe on Windows
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install mpv (Windows)
        if: runner.os == 'Windows'
        # choco adds mpv to PATH only for new sessions, so this also tests that cn-live-viewer finds it without PATH
        run: choco install mpv -y --no-progress
      - run: python -m pip install .
      - name: mpv smoke test (must run here, not skip)
        env:
          CNLV_REQUIRE_MPV: "1"
        run: python -m unittest tests.test_mpv_smoke -v

  install-windows:
    # the whole Windows installer as a user runs it, in Windows PowerShell 5.1 (what "PowerShell" opens on Windows),
    # on what looks like a PC without Python or mpv: winget is skipped and the Pythons already here are ignored, so
    # Python comes from python.org and mpv from its GitHub release. A stand-in for Windows' "Python was not found"
    # placeholder comes first on PATH. Then the installed copy checks itself, and must find that mpv on its own and
    # talk to it over the named pipe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.ps1
        shell: powershell
        env:
          CNLV_NO_WINGET: "1"
          CNLV_NO_SYSTEM_PYTHON: "1"
        run: |
          $stub = New-Item -ItemType Directory "$env:RUNNER_TEMP\stub"
          Set-Content "$stub\python.bat" "@echo Python was not found; run without arguments to install from the Microsoft Store. 1>&2`r`n@exit /b 9009"
          $env:Path = "$stub;$env:Path"
          ./install.ps1 -Yes
      - name: The installed copy finds the downloaded mpv
        shell: powershell
        env:
          CNLV_REQUIRE_MPV: "1"
        run: |
          & "$env:LOCALAPPDATA\cn-live-viewer\venv\Scripts\cn-live-viewer.exe" check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:LOCALAPPDATA\cn-live-viewer\venv\Scripts\python.exe" -m unittest tests.test_mpv_smoke -v
          if ($LASTEXITCODE -ne 0) { exit 1 }

  install-unix:
    # the whole Linux/macOS installer: the system packages (apt, Homebrew), cn-live-viewer, the launcher, its check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh
        run: sh install.sh --yes
      - name: The installed copy checks itself and talks to mpv
        env:
          CNLV_REQUIRE_MPV: "1"
        run: |
          exe=$(command -v cn-live-viewer || echo "$HOME/.local/bin/cn-live-viewer")
          "$exe" check
          py=$(head -n 1 "$exe" | cut -c 3- | cut -d " " -f 1)   # the installed copy's own Python (pipx adds " -E")
          "$py" -m unittest tests.test_mpv_smoke -v

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Syntax check the mpv scripts
        run: for f in src/cn_live_viewer/mpv/*.lua; do luajit -bl "$f" > /dev/null || exit 1; done

  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
