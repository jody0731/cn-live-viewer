# cn-live-viewer's two picture modes (right-click, Picture), loaded with --include. They set only the options below,
# over the same options in your mpv.conf; switching between them takes effect at once.

# Efficient (the default): mpv's own default scaling, and a new picture only when the video has one
[cnlv-efficient]
profile-desc=Less GPU and power
scale=lanczos
dscale=hermite
deband=no
video-sync=audio
interpolation=no

# High quality: sharper upscaling, and the video timed to the display with frames blended between, so 30 and 60 fps
# move smoothly at 144 Hz and up. Draws every display refresh: several times the GPU work and power.
[cnlv-high-quality]
profile-desc=Sharper and smoother, more GPU and power
scale=ewa_lanczossharp
dscale=hermite
deband=no
video-sync=display-resample
interpolation=yes
tscale=oversample
