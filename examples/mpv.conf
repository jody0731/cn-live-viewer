# Optional personal settings for ~/.config/mpv/mpv.conf. cn-live-viewer works without them;
# it already passes the playback settings it needs (see DEFAULT_MPV_ARGS in player.py).
# (the volume isn't here: cn-live-viewer keeps the one you last set, 50% at first)
# keep the window size the same on HiDPI screens
hidpi-window-scale=no
